set -g default-terminal "tmux-256color"
set -s escape-time 0
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on
set -g mouse on
set -g history-limit 100000

# vi key movement for copy/pasta mode
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
bind Space copy-mode

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5


unbind r
bind r source-file ~/.tmux.conf

unbind w
unbind s
bind s display-popup -E -x C -y C -w 60% -h 45% 'sh -c "$HOME/.tmux/scripts/session-picker.sh"'

set-option -g prefix C-b

# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# run prefix + I to install plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'o0th/tmux-nova'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @nova-nerdfonts true
set -g @nova-nerdfonts-left 
set -g @nova-nerdfonts-right 

# Vesper (matches Ghostty theme)
set -g @nova-pane-active-border-style "#ffc799"
set -g @nova-pane-border-style "#333333"
set -g @nova-status-style-bg "#1c1c1c"
set -g @nova-status-style-fg "#a0a0a0"
set -g @nova-status-style-active-bg "#ffc799"
set -g @nova-status-style-active-fg "#101010"
set -g @nova-status-style-double-bg "#101010"

set -g @nova-pane "#I#{?pane_in_mode,  #{pane_mode},}  #W"

set -g @nova-segment-mode "#{?client_prefix,*,▷}"
set -g @nova-segment-mode-colors "#ffc799 #1c1c1c"

set -g @nova-segment-whoami "#(whoami)@#h"
set -g @nova-segment-whoami-colors "#ffc799 #1c1c1c"
set -g @nova-segments-0-right "whoami"

set -g @nova-rows 0
set -g @nova-segments-0-left "mode"

run '~/.tmux/plugins/tpm/tpm'

# Pi
# extended-keys is a *server* option: -g silently no-ops
set -s extended-keys on
set -s extended-keys-format csi-u
# tell tmux the outer terminal speaks extended keys, so it asks for them
set -as terminal-features 'xterm*:extkeys'


bind [ split-window -h -c "#{pane_current_path}"
bind ] split-window -v -c "#{pane_current_path}"

set -ga terminal-features ",*:progressbar" # Show progress bar at bottom
