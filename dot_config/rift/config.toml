# Rift — tiling window manager (mirrors the old AeroSpace setup)
# Docs: https://acsandmann.github.io/rift-docs/   Default config: rift.default.toml in the repo
# Edits hot-reload on save. Workspace numbers in this file are 0-based (Alt+1 = workspace 0).

[settings]
default_disable = false            # manage every space automatically
animate = true
animation_duration = 0.2
animation_fps = 120.0              # 0.0 (display rate) crashes in 0.7.2

focus_follows_mouse = false
mouse_follows_focus = false
mouse_hides_on_focus = false

auto_focus_blacklist = ["com.raycast.macos"]   # Raycast popups don't yank workspaces
# tell SketchyBar when workspaces or windows change, so the bar updates instantly
run_on_start = [
  "rift-cli subscribe cli --event workspace_changed --command sketchybar --args --trigger --args rift_workspace_changed",
  "rift-cli subscribe cli --event windows_changed --command sketchybar --args --trigger --args rift_workspace_changed",
]
hot_reload = true

[settings.layout]
mode = "traditional"               # i3-style: new windows open side by side in the focused container, equal widths; "bsp" halves the focused one
window_insertion_point = "next_to_selection"

[settings.layout.traditional]
equalize_nodes = true

[settings.layout.stack]
stack_offset = 30.0
default_orientation = "perpendicular"

# Space around windows, leaves room for JankyBorders
[settings.layout.gaps.outer]
top = 8                            # notch row (~38pt in More Space) + 8 → windows sit ~6pt under the bar islands, matching the 8pt sides
left = 8
bottom = 8
right = 8

[settings.layout.gaps.inner]
horizontal = 12
vertical = 12

[settings.ui.menu_bar]
enabled = true                     # workspace indicator in the menu bar
show_empty = false
show_binding_mode = true           # shows "service" while that mode is on
mode = "all"
active_label = "index"
display_style = "layout"

[settings.ui.stack_line]
enabled = true                     # tab strip beside stacked windows

[settings.ui.mission_control]
enabled = false

[settings.gestures]
enabled = true                     # 3-finger horizontal swipe = next/previous workspace
fingers = 3
consume_dock_swipe = true          # Rift takes the swipe so macOS doesn't also switch Spaces
skip_empty = true                  # swipe past empty workspaces (4, 5)
invert_horizontal_swipe = false    # flip if the direction feels backwards
haptics_enabled = true

[virtual_workspaces]
mode = "per_display"
enabled = true
default_workspace_count = 5
auto_assign_windows = true
preserve_focus_per_workspace = true
workspace_auto_back_and_forth = false
workspace_names = ["web", "code", "chat", "four", "five"]
workspace_rules = []

# ── Apps → workspaces (0 = web, 1 = code, 2 = chat) ─────────────────────
# find an app's id: osascript -e 'id of app "Name"'
app_rules = [
  { app_id = "com.apple.Safari",          workspace = 0 },
  { app_id = "com.superlogical.rex",      workspace = 1 },
  { app_id = "com.mitchellh.ghostty",     workspace = 1 },
  { app_id = "dev.zed.Zed",               workspace = 1 },
  { app_id = "com.apple.dt.Xcode",        workspace = 1 },
  { app_id = "com.tinyspeck.slackmacgap", workspace = 2 },
  { app_id = "com.microsoft.teams2",      workspace = 2 },
  { app_id = "com.apple.Music",           workspace = 2 },
  { app_id = "com.apple.finder",            floating = true },
  { app_id = "com.apple.systempreferences", floating = true },
]

[modifier_combinations]
comb1 = "Alt + Shift"

# ── Keys ────────────────────────────────────────────────────────────────
# Alt = ⌥. Alt+arrows, Alt+Shift+arrows and Alt+Backspace are left alone for text editing.
[keys]
# switch workspace
"Alt + 1" = { switch_to_workspace = 0 }   # web
"Alt + 2" = { switch_to_workspace = 1 }   # code
"Alt + 3" = { switch_to_workspace = 2 }   # chat
"Alt + 4" = { switch_to_workspace = 3 }
"Alt + 5" = { switch_to_workspace = 4 }
"Alt + Tab" = "switch_to_last_workspace"
"Ctrl + Left" = { prev_workspace = true }     # previous workspace (macOS's own "move a space" keys), skips empty ones
"Ctrl + Right" = { next_workspace = true }    # next workspace

# send the focused window to a workspace
"comb1 + 1" = { move_window_to_workspace = 0 }
"comb1 + 2" = { move_window_to_workspace = 1 }
"comb1 + 3" = { move_window_to_workspace = 2 }
"comb1 + 4" = { move_window_to_workspace = 3 }
"comb1 + 5" = { move_window_to_workspace = 4 }

# focus a neighbour: ⌃⌘ + arrows
"Ctrl + Meta + Left" = { move_focus = "left" }
"Ctrl + Meta + Down" = { move_focus = "down" }
"Ctrl + Meta + Up" = { move_focus = "up" }
"Ctrl + Meta + Right" = { move_focus = "right" }

# swap with a neighbour: ⌃⌘⇧ + arrows
"Ctrl + Meta + Shift + Left" = { move_node = "left" }
"Ctrl + Meta + Shift + Down" = { move_node = "down" }
"Ctrl + Meta + Shift + Up" = { move_node = "up" }
"Ctrl + Meta + Shift + Right" = { move_node = "right" }

# size and layout
"Alt + F" = "toggle_fullscreen_within_gaps"   # fill the screen, keep gaps + border
"comb1 + F" = "toggle_fullscreen"             # truly edge to edge
"Alt + Minus" = { resize_window_shrink = "horizontal" }   # narrower
"Alt + Equal" = { resize_window_grow = "horizontal" }     # wider
"comb1 + Minus" = { resize_window_shrink = "vertical" }   # shorter
"comb1 + Equal" = { resize_window_grow = "vertical" }     # taller
"Alt + Slash" = "toggle_orientation"          # side by side <-> stacked split
"Alt + Comma" = "toggle_stack"                # tab-like stack
"comb1 + Space" = { toggle_window_floating = { center = true, size = "smart" } }   # "reasonable size": float, centre, sensible size; again to re-tile

# rarely used stuff lives behind a "service" mode
"comb1 + Semicolon" = { binding_mode = "service" }

# keep all [keys] above this line — the next header starts the mode's keymap
[binding_modes.service]
"Escape" = [ "reload_config", { binding_mode = "default" } ]
"R" = [ "balance", { binding_mode = "default" } ]                    # even out sizes
"F" = [ { toggle_window_floating = { center = true, size = "smart" } }, { binding_mode = "default" } ]   # float centred / unfloat
# join with a neighbour: [A|B|C], focus C, ⌥⇧; then ⌃⌘⇧←  ->  A | B/C stacked
"Ctrl + Meta + Shift + Left" = [ { join_window = "left" },  { binding_mode = "default" } ]
"Ctrl + Meta + Shift + Down" = [ { join_window = "down" },  { binding_mode = "default" } ]
"Ctrl + Meta + Shift + Up" = [ { join_window = "up" },    { binding_mode = "default" } ]
"Ctrl + Meta + Shift + Right" = [ { join_window = "right" }, { binding_mode = "default" } ]
"U" = [ "unjoin_windows", { binding_mode = "default" } ]             # undo a join
